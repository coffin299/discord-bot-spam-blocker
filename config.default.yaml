# ============================================================
# Discord Spam / Nuke Blocker - 設定テンプレート
# 初回起動時に config.yaml へコピーされます。
# ============================================================

# Discord Developer Portal で発行したBOTトークン（必須）
bot_token: "YOUR_BOT_TOKEN_HERE"

# ------------------------------------------------------------
# 機能スイッチ（true/false）
# token 直下にまとめている。各スイッチの意味は直上コメントを参照。
# ------------------------------------------------------------

# スパムフィルター全体の有効/無効。false だと招待・リンク・NGワード等の検知を行わない
enable_spam_filter: true

# 許可リスト外のBOT投稿をすべて削除する（allowed_bots が空のときは無効＝全BOT許可）
block_all_unauthorized_bots: true

# allowed_bots が空でないとき、リスト外BOTがサーバーに参加したらキックする
kick_unauthorized_bots_on_join: true

# 未許可BOTの埋め込み付き投稿を削除する（block_all_unauthorized_bots が false のとき主に効く）
block_embeds: false

# Discord招待リンク（discord.gg 等）を含む投稿を削除する
block_discord_invites: true

# 疑わしいリンク・フィッシング定型に一致する投稿を削除する
block_suspicious_links: true

# 絵文字数が上限を超える投稿を削除する
block_excessive_emojis: true

# 英字の大文字比率が高い投稿を削除する（短い文は対象外）
block_excessive_caps: true

# @everyone / @here 付き投稿を削除する
block_mass_mentions: true

# メンション数が上限を超える投稿を削除する
block_excessive_mentions: true

# 削除時にチャンネルへ短い警告メッセージを出す（数秒後に自動削除）
send_warning: true

# ハニーポット（罠チャンネル）機能の有効/無効。既定はオフ
honeypot_enabled: false

# ハニーポット作動時、対象ユーザーの既存メッセージを可能な範囲で削除する
honeypot_purge_user_messages: true

# アンチニューク（大量キック/バン等の検知と隔離）の有効/無効
nuke_enabled: true

# 緊急ロックダウン機能そのものの ON/OFF。既定 false（検知・隔離は nuke_enabled 側）
nuke_lockdown_enabled: false

# nuke_lockdown_enabled が true のとき、閾値超過で自動ロックダウンするか
nuke_auto_lockdown: true

# ロックダウン完了後に admin_ids へDM通知するか（失敗時はログチャンネルへフォールバック）
nuke_notify_admins_dm: true

# ------------------------------------------------------------
# ID・対象リスト
# ------------------------------------------------------------

# 緊急ロックダウン操作・解除・完了DMの宛先となる管理者ユーザーID
# Discordの「管理者権限」とは別。ここに書いたIDのみが !!!lockdown / !!!unlock_lockdown 等を使える
admin_ids:
  - "YOUR_ADMIN_USER_ID"

# 許可するBOTのユーザーID一覧
# 空リスト [] の場合は「すべてのBOTを許可」（投稿削除・参加キックをしない）
# IDを1件以上入れるとホワイトリスト運用になり、リスト外BOTを制限する
allowed_bots: []

# スパムフィルターを適用しない信頼ユーザーのID
whitelisted_users: []

# 監視するサーバーID。空ならBOTが参加している全サーバーが対象
monitored_guilds: []

# 監視するチャンネルID。空なら監視サーバー内の全チャンネルが対象
monitored_channels: []

# ------------------------------------------------------------
# スパム詳細（閾値・パターン・NGワード）
# ------------------------------------------------------------

# block_excessive_emojis 時に許容する最大絵文字数
max_emoji_count: 10

# block_excessive_caps 時の大文字比率しきい値（0.7 = 70%）
caps_ratio_threshold: 0.7

# block_excessive_mentions 時に許容する最大メンション数
max_mention_count: 5

# Discord招待リンク検知用の正規表現一覧
discord_invite_patterns:
  - 'discord\.gg/[\w-]+'
  - 'discord\.com/invite/[\w-]+'
  - 'discordapp\.com/invite/[\w-]+'
  - 'dsc\.gg/[\w-]+'
  - 'discord\.new'
  - 'dis\.gd/[\w-]+'

# 疑わしいリンク検知用の正規表現（2026-08）。公式ホストはコード側で除外
blocked_link_patterns:
  # IPロガー・追跡
  - 'grabify'
  - 'iplogger'
  - 'ip(?:log|grab)'
  - 'yip\.su'
  - '2no\.co'
  # 短縮URL
  - 'bit\.ly'
  - 'tinyurl\.com'
  - 'cutt\.ly'
  - 'is\.gd'
  - 'rb\.gy'
  - 't\.ly'
  - 'shorturl\.at'
  - 'ow\.ly'
  - 's\.id'
  - 'v\.gd'
  # Discord 偽ドメイン・ギフト詐欺ホスト
  - 'dlscord'
  - 'd1scord'
  - 'disc0rd'
  - 'discrod'
  - 'dicsord'
  - 'discorcl'
  - 'ddiscord'
  - 'discordn(?:itro)?'
  - 'discord(?:app)?[-.]?(?:gift|nitro|airdrop|verify|login|boost)'
  - 'discordgift'
  - 'discordapp-gifts?'
  # Steam 偽ドメイン
  - 'steamcommun(?:ytu|itu|lty)'
  - 'steamcornmunity'
  - 'steamnitro'
  - 'steam-discord'
  - 'steamcommunity\.ru'
  # Nitro / 検証 / 懸賞金フレーズ
  - 'free[-_ ]?nitro'
  - 'nitro[-_ ]?(?:free|gift|claim|airdrop)'
  - 'gift[-_ ]?nitro'
  - 'claim[-_ ]?(?:nitro|prize|reward)'
  - 'verify[-_ ]?(?:account|login|discord)'
  - 'login[-_ ]?to[-_ ]?claim'
  - 'hypesquad[-_ ]?event'
  - 'free[-_ ]?(?:crypto|skin|robux)'
  - 'nft[-_ ]?giveaway'
  - 'airdrop'
  - 'suspended[-_ ]?account'
  - 'urgent[-_ ]?action'
  # 危険ファイル直リンク
  - '\.exe(?:\?|$)'
  - '\.scr(?:\?|$)'
  - '\.bat(?:\?|$)'
  - '\.msi(?:\?|$)'
  - '\.apk(?:\?|$)'
  # IP直打ち
  - 'https?://\d{1,3}(?:\.\d{1,3}){3}'
  # 旧Freenom系TLD
  - 'https?://[^\s/]+\.(?:tk|ml|ga|cf|gq)(?:/|\s|$)'
  # 使い捨てファイルホスト
  - 'gofile\.io'
  - 'anonfiles'
  - 'pixeldrain\.com'

# カスタムNGワード（部分一致・大文字小文字無視）。2026-08の詐欺定型
custom_blocked_words:
  # Nitro / Discord ギフト詐欺
  - "無料ニトロ"
  - "フリーニトロ"
  - "free nitro"
  - "free discord nitro"
  - "nitro for free"
  - "nitro airdrop"
  - "discord is giving"
  - "working nitro gen"
  - "nitro generator"
  - "catch this nitro"
  - "who will get this free nitro"
  # Steam ギフト詐欺
  - "steam gift"
  - "steam gived nitro"
  - "steam is giving"
  - "bro steam gift"
  - "無料スチーム"
  - "steam ギフト"
  - "valve admin"
  # 偽サポート・誤通報スクリプト
  - "accidentally reported"
  - "i accidentally reported"
  - "誤って通報"
  - "サポートに連絡"
  - "contact support"
  # 検証・ログイン誘導
  - "verify your account"
  - "アカウントを確認"
  - "login to claim"
  - "qr code login"
  - "スキャンしてログイン"
  # 暗号資産・ギブアウェイ
  - "free crypto"
  - "crypto giveaway"
  - "nft giveaway"
  - "airdrop"
  - "connect your wallet"
  - "シードフレーズ"
  - "ウォレット接続"
  # その他定型
  - "i made a game can you test"
  - "test my game"
  - "無料ギフト"
  - "フリーギフト"
  - "限定配布"
  - "先着"

# ------------------------------------------------------------
# ハニーポット詳細
# 罠チャンネルに除外対象外が投稿すると即処罰（ハックユーザー想定）
# 上の honeypot_enabled / honeypot_purge_user_messages と併用
# ------------------------------------------------------------
honeypot:
  # 罠にするチャンネルID一覧（空なら作動しない）
  channel_ids: []
  # 追加の除外ID（bot/user）。admin_ids / whitelisted_users / allowed_bots に加えて除外
  whitelist_ids: []
  # 処罰方法: kick（既定）または ban
  action: kick
  # Kick/Ban の理由欄に書く文言
  reason: "ハニーポット作動"
  # kick 時にこの回数までKICKを許容。超過した作動でBAN確定（例: 3 → 4回目BAN）
  max_kick_before_ban: 3
  # ストライクをリセットする日数。null なら永続
  strike_reset_days: null
  # ログチャンネルID。null なら nuke.log_channel_id を流用
  log_channel_id: null

# ------------------------------------------------------------
# アンチニューク / 緊急ロックダウン詳細
# 上の nuke_* スイッチと併用
# ------------------------------------------------------------
nuke:
  # 検知ログの送信先チャンネルID。null ならコンソールのみ
  log_channel_id: null
  # スライディングウィンドウ秒数（この秒数内の件数で閾値判定）
  window_seconds: 10
  # ウィンドウ内のBAN上限（以上で隔離）
  max_bans: 3
  # ウィンドウ内のキック上限
  max_kicks: 3
  # ウィンドウ内のチャンネル削除上限
  max_channel_deletes: 3
  # ウィンドウ内のチャンネル作成上限
  max_channel_creates: 5
  # ウィンドウ内のロール削除上限
  max_role_deletes: 3
  # ウィンドウ内のWebhook更新上限
  max_webhooks: 3
  # 実行者への自動処置: timeout または strip_roles
  action: timeout
  # action が timeout のときの分数
  timeout_minutes: 60
